<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Realm of Atheria | Dexterity</title>
  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <div class="viewport">

    <!-- CORNER LOGOS -->
    <img src="./MMCOE-LOGO.png" class="mmcoe-logo" />
    <img src="./AESA-Logo.png" class="aesa-logo" />

    <!-- PERSISTENT HEADER -->
    <div class="persistent-header">
      <img src="./dex-no-bg.png" class="dexterity-presents-img" />

      <div class="title-row">
        <!-- <img src="./GAME-LOGO.PNG" class="game-emblem" /> -->
        <!-- <img src="./Reals of Atheria.PNG" class="game-title-img" /> -->
        
      </div>
    </div>

    <!-- SCREEN AREA -->
    <div class="screen-area backdrop-blur-md">

      <!-- FIRST SCREEN -->
      <div class="first-screen">

  <!-- BLURRED GAME LOGO BACKGROUND -->
  <img
    src="./GAME-LOGO.PNG"
    alt="Realm of Atheria Background Logo"
    class="bg-game-logo blur-sm"
  />

  <div class="subtitle">Choose Your Destiny</div>

  <div class="card-container">
    <div class="card stone-tablet" onclick="selectDifficulty(5,this)">
      <div class="tablet-content"><h2>5</h2><p>1 STEP</p></div>
    </div>
    <div class="card stone-tablet" onclick="selectDifficulty(10,this)">
      <div class="tablet-content"><h2>10</h2><p>2 STEPS</p></div>
    </div>
    <div class="card stone-tablet" onclick="selectDifficulty(15,this)">
      <div class="tablet-content"><h2>15</h2><p>3 STEPS</p></div>
    </div>
  </div>

  <button class="jungle-btn" onclick="startTrial()">Enter the Jungle</button>
</div>


      <!-- TRIAL SCREEN -->
      <div id="trial-screen" class="hidden">
        <div class="difficulty-header">
          <span id="difficulty-badge"></span>
          <span id="tribe-header"></span>
        </div>

        <div class="question-wrapper">
          <div id="global-timer" class="timer-above hidden"></div>

          <div id="question-area">
            <button class="jungle-btn" onclick="generateQuestion()">
              Roll the Sacred Dice
            </button>
          </div>
        </div>

        <div id="options-grid" class="hidden"></div>
        <div id="feedback"></div>
      </div>
      <div id="result-screen" class="hidden">
        <h2 id="result-message"></h2>
        <button class="jungle-btn" onclick="restartGame()">Return to Village</button>

    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
